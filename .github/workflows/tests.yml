name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试 + 仪器自检 (Python ${{ matrix.python-version }})
    # Python 3.9 的预编译包不提供 Ubuntu 26.04，固定到受支持的镜像。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # 先用纯标准库验证常规运行，再单独验证需要 NumPy 的可选训练器。
      - name: 单元测试与集成测试（使用本机假服务）
        run: python3 -m model_test test

      - name: 安装参考库训练测试依赖
        run: python3 -m pip install 'numpy>=1.26,<3'

      - name: 参考库训练与留出评估（合成样本）
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python3 -m unittest tests.test_reference_training -v

      - name: 仪器自检（验证平台测时间/分类状态码是否准）
        run: python3 -m model_test selftest
