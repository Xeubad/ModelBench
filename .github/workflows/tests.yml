name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试 + 仪器自检 (Python ${{ matrix.python-version }})
    # Python 3.9 的预编译包不提供 Ubuntu 26.04，固定到受支持的镜像。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # 项目零依赖（只用标准库），不需要 pip install
      - name: 单元测试与集成测试（使用本机假服务）
        run: python3 -m model_test test

      - name: 仪器自检（验证平台测时间/分类状态码是否准）
        run: python3 -m model_test selftest
